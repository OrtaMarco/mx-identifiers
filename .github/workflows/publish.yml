name: publish

# Publica a npm al empujar una etiqueta `vX.Y.Z`.
#
# Requiere el secreto NPM_TOKEN (token de automatización de npm) en el repositorio.
# `id-token: write` es lo que permite firmar la publicación con procedencia, de modo
# que npm muestre desde qué commit y qué workflow salió el paquete.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: La etiqueta debe coincidir con la versión del package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "La etiqueta v$TAG no coincide con la versión $PKG del package.json" >&2
            exit 1
          fi

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
